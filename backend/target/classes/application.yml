server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/minitwitter
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000

app:
  cors:
    allowed-origins: http://localhost:3000

rabbitmq:
  exchanges:
    social: social.exchange
  queues:
    post-created: post.created.queue
    post-liked: post.liked.queue
    comment-added: comment.added.queue
    user-followed: user.followed.queue
  routing-keys:
    post-created: post.created
    post-liked: post.liked
    comment-added: comment.added
    user-followed: user.followed

cache:
  feed:
    ttl: 300
  trending:
    ttl: 600
  prefix:
    feed: "feed:"
    trending: "trending"
