# Local / dev defaults only. For production, replace via Sealed Secrets, External Secrets,
# or kubectl apply with values from a secret manager (do not reuse these values).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: mini-twitter
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: mini-twitter
type: Opaque
stringData:
  username: postgres
  password: postgres
  database: minitwitter
