apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mini-twitter
  namespace: mini-twitter
  labels:
    app.kubernetes.io/name: mini-twitter
    app.kubernetes.io/part-of: mini-twitter
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: mini-twitter.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
