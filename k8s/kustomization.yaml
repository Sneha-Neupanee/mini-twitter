apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - database/postgres-secret.yaml
  - database/postgres-service.yaml
  - database/postgres-statefulset.yaml
  - rabbitmq/rabbitmq-secret.yaml
  - rabbitmq/rabbitmq-service.yaml
